name: Benchmarks

# Runs the comparison suite against Polars (Rust crate and Python wheel),
# Apache Arrow (arrow-rs) and pandas, publishes the tables and charts to the
# job summary and to bench/results/, and fails if dataframes is slower than a
# competitor anywhere.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bench/**"
      - "!bench/results/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"
  pull_request:
    paths:
      - "src/**"
      - "bench/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      rows:
        description: Row counts, comma separated
        default: "100000,1000000,10000000"
      rounds:
        description: Rounds per library and case
        default: "3"
      time_ms:
        description: Measurement time per case in milliseconds
        default: "300"

permissions:
  contents: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TARGET_DIR: target/native
  # Every library is compiled for the host CPU: the competitors' kernels rely
  # on compile-time vectorisation, so this is their best configuration.
  # dataframes selects its vector kernels at run time and does not need it.
  RUSTFLAGS: "-C target-cpu=native"
  ROWS: ${{ inputs.rows || '100000,1000000,10000000' }}
  ROUNDS: ${{ inputs.rounds || '3' }}
  TIME_MS: ${{ inputs.time_ms || '300' }}

jobs:
  bench:
    name: dataframes vs Polars, Arrow, pandas
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Describe the machine
        id: machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core|Socket|L1d|L2|L3|Flags" | sed 's/^Flags.*avx512f.*/Flags: ... avx512 present/; s/^Flags.*avx2.*/Flags: ... avx2 present, no avx512/'
          free -g | head -2
          echo "transparent huge pages: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          echo "cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -1 | tr -cs 'A-Za-z0-9' '-')" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: bench/python/requirements.txt

      - name: Install pandas and the Polars wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bench/python/requirements.txt
          python -c "import numpy, pandas, polars, pyarrow; print('numpy', numpy.__version__, '| pandas', pandas.__version__, '| polars', polars.__version__, '| pyarrow', pyarrow.__version__)"

      # Objects built with target-cpu=native are only valid on the CPU model
      # they were built on, so the model is part of the cache key.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/native
          key: bench-${{ runner.os }}-${{ steps.machine.outputs.cpu }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}

      - name: Build the drivers
        run: cargo build --release --locked -p bench-ours -p bench-polars -p bench-arrow -p bench-common

      - name: Run
        run: >
          python scripts/bench.py run --per-case
          --rows "$ROWS" --rounds "$ROUNDS" --time-ms "$TIME_MS"
          --libs ours,polars,arrow,python

      - name: Report
        run: |
          python scripts/bench.py report --name latest --readme README.md > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: |
            bench/results/raw.jsonl
            bench/results/latest*
            report.md
          if-no-files-found: warn

      - name: Publish the results to the repository
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md bench/results/latest.md bench/results/latest.json bench/results/latest-*.svg
          if git diff --cached --quiet; then
            echo "results unchanged"
          else
            git commit -m "bench: results from run ${{ github.run_number }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Gate - dataframes must not be slower than any competitor
        run: python scripts/bench.py report --name latest --gate > /dev/null
